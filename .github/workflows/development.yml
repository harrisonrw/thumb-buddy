name: Development

on:
  # Callable by other workflows (e.g. a future Release workflow) so the build
  # steps -- including the CMake version pin -- live in exactly one place.
  workflow_call:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-26.04,  name: Linux }
          - { os: macos-latest,  name: macOS }

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Runner images ship CMake 3.31 (Ubuntu) and 4.1 (macOS), both below the
      # 4.2 that CMakeLists.txt requires, so install a newer one explicitly.
      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "4.3.1"

      # FFmpeg is consumed through pkg-config, so each runner needs the
      # development packages (headers + .pc files) rather than the ffmpeg
      # binary the images already ship. The Ubuntu release is pinned rather
      # than tracking ubuntu-latest because core/CMakeLists.txt requires
      # FFmpeg 8, and only 26.04 carries it in apt.
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libavformat-dev \
            libavcodec-dev \
            libavutil-dev \
            libswscale-dev

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install pkg-config ffmpeg

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
